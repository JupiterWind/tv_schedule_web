name: Update TV Schedule

on:
  schedule:
    - cron: "0 8 * * *" # 매일 UTC 09:00 (한국시간 오후 5시)
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능하게

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Run crawler
        working-directory: src
        run: uv run --project .. schedule_crawler.py

      - name: Commit updated schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schedule.json
          git diff --staged --quiet || git commit -m "Update schedule.json"
          git push
