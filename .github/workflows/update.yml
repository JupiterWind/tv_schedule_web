name: Update TV Schedule

on:
  schedule:
    - cron: "0 22 * * *" # 매일 UTC 22:00 = 한국시간 오전 7시
    - cron: "0 8 * * *" # 매일 UTC 08:00 = 한국시간 오후 5시
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능하게

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # setup-uv 버전을 v3에서 v5로 업데이트하여 Node.js 24 호환성 해결
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest" # 또는 사용 중인 특정 uv 버전 명시 (예: "0.5.0")

      # 파이썬 버전 명시 (uv sync가 부모 파이썬을 안정적으로 찾도록 권장)
      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Run crawler
        working-directory: src
        run: uv run --project .. schedule_crawler.py

      - name: Commit updated schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/schedule.json
          git diff --staged --quiet || git commit -m "Update schedule.json"
          git push
