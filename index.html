<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘의 편성표</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 20px;
      }
      h1 .date {
        font-weight: normal;
        color: #666;
        font-size: 15px;
        margin-left: 8px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-top: 20px;
        border-bottom: 2px solid #333;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab-btn {
        padding: 8px 16px;
        font-size: 14px;
        background: none;
        border: none;
        cursor: pointer;
        color: #888;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .tab-btn.active {
        color: #111;
        font-weight: bold;
        border-bottom: 2px solid #111;
      }
      .genre-section {
        display: none;
      }
      .genre-section.active {
        display: block;
      }
      .channel {
        margin-top: 16px;
      }
      .channel-name {
        font-weight: bold;
        margin-bottom: 6px;
        word-break: keep-all;
      }
      .channel-no {
        color: #999;
        font-weight: normal;
        font-size: 13px;
      }
      .program {
        display: flex;
        gap: 12px;
        padding: 4px 8px;
        font-size: 14px;
        border-radius: 4px;
      }
      .program.current {
        background: #fff3cd;
      }
      .time {
        color: #666;
        width: 50px;
        flex-shrink: 0;
      }
      .title {
        font-weight: 500;
        word-break: keep-all;
      }
      .sub {
        color: #888;
        font-size: 13px;
        word-break: keep-all;
      }
      #status {
        color: #888;
        font-size: 13px;
      }

      /* 좁은 화면(모바일) 대응 */
      @media (max-width: 480px) {
        body {
          margin: 16px auto;
          padding: 0 12px;
        }
        h1 {
          font-size: 17px;
        }
        h1 .date {
          display: block;
          margin-left: 0;
          margin-top: 4px;
          font-size: 13px;
        }
        .tab-btn {
          padding: 8px 12px;
          font-size: 13px;
        }
        .program {
          flex-direction: column;
          gap: 2px;
          padding: 6px 8px;
        }
        .time {
          width: auto;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <h1>오늘의 편성표 <span class="date" id="today-date"></span></h1>
    <p id="status">불러오는 중...</p>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>

    <script>
      function renderTodayDate() {
        const now = new Date();
        const days = ["일", "월", "화", "수", "목", "금", "토"];
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        const day = days[now.getDay()];
        document.getElementById("today-date").textContent =
          `${y}.${m}.${d} (${day})`;
      }

      async function loadSchedule() {
        try {
          const res = await fetch("schedule.json");
          const data = await res.json();
          render(data);
        } catch (e) {
          document.getElementById("status").textContent =
            "schedule.json을 불러오지 못했습니다. 같은 폴더에서 로컬 서버로 실행 중인지 확인하세요.";
        }
      }

      function toMinutes(timeStr) {
        const [h, m] = timeStr.split(":").map(Number);
        return h * 60 + m;
      }

      function findCurrentIndex(programs) {
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        let currentIdx = -1;
        for (let i = 0; i < programs.length; i++) {
          if (toMinutes(programs[i].time) <= nowMin) {
            currentIdx = i;
          } else {
            break;
          }
        }
        return currentIdx;
      }

      function switchTab(genre) {
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.genre === genre);
        });
        document.querySelectorAll(".genre-section").forEach((section) => {
          section.classList.toggle("active", section.dataset.genre === genre);
        });
      }

      function render(data) {
        document.getElementById("status").remove();
        const tabsEl = document.getElementById("tabs");
        const content = document.getElementById("content");

        const visibleGenres = Object.entries(data).filter(
          ([, channels]) => channels.length > 0,
        );

        visibleGenres.forEach(([genre], i) => {
          const btn = document.createElement("button");
          btn.className = "tab-btn" + (i === 0 ? " active" : "");
          btn.textContent = genre;
          btn.dataset.genre = genre;
          btn.addEventListener("click", () => switchTab(genre));
          tabsEl.appendChild(btn);
        });

        visibleGenres.forEach(([genre, channels], i) => {
          const section = document.createElement("div");
          section.className = "genre-section" + (i === 0 ? " active" : "");
          section.dataset.genre = genre;

          for (const { channel, channel_no, programs } of channels) {
            const channelDiv = document.createElement("div");
            channelDiv.className = "channel";

            const nameEl = document.createElement("div");
            nameEl.className = "channel-name";
            nameEl.innerHTML = channel_no
              ? `${channel} <span class="channel-no">[${channel_no}]</span>`
              : channel;
            channelDiv.appendChild(nameEl);

            const currentIdx = findCurrentIndex(programs);

            programs.forEach((p, idx) => {
              const row = document.createElement("div");
              row.className =
                "program" + (idx === currentIdx ? " current" : "");
              row.innerHTML = `
          <span class="time">${p.time}</span>
          <span>
            <span class="title">${p.title}</span>
            ${p.sub_title ? `<span class="sub"> · ${p.sub_title}</span>` : ""}
          </span>
        `;
              channelDiv.appendChild(row);
            });
            section.appendChild(channelDiv);
          }
          content.appendChild(section);
        });
      }

      renderTodayDate();
      loadSchedule();
    </script>
  </body>
</html>
